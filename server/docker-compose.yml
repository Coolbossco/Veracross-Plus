version: "3.9"

services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/remote_sync?schema=public"
      JWT_SECRET: "change-me"
      REFRESH_TOKEN_SECRET: "change-me-too"
      EXTENSION_SHARED_SECRET: ""
      ALLOWED_ORIGINS: "https://example-extension-origin"
      TOKEN_ISSUER: "veracross-plus-sync"
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: remote_sync
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

