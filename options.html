<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Veracross Plus Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        margin: 40px;
        color: #2c3e50;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }

      input[type="url"] {
        width: 100%;
        max-width: 480px;
        padding: 10px 12px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 14px;
      }

      button {
        margin-top: 16px;
        padding: 10px 18px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }

      .hint {
        font-size: 12px;
        color: #6c757d;
        margin-top: 6px;
      }

      .status {
        margin-top: 12px;
        font-size: 13px;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <h1>Remote Sync Settings</h1>

    <section style="margin-bottom: 24px;">
      <h2 style="font-size:18px; margin-bottom:12px;">Account</h2>
      <div id="accountStatus" class="status" style="margin-top:0;">
        Detecting account status…
      </div>
      <button id="logoutBtn" style="margin-top:12px;">Log Out</button>
      <div class="hint" style="margin-top:10px;">
        Use the extension popup to sign in or create an account. Logging out here clears the stored credentials on this device.
      </div>
    </section>

    <section>
      <h2 style="font-size:18px; margin-bottom:12px;">API Endpoint</h2>
      <label for="apiBaseUrl">API Base URL</label>
      <input
        type="url"
        id="apiBaseUrl"
        placeholder="https://api.example.com/api"
      />
      <div class="hint">
        Set the Dokploy API endpoint used by the extension. Include the
        <code>/api</code> path.
      </div>
      <button id="saveBtn">Save</button>
      <div id="saveStatus" class="status"></div>
    </section>

    <script src="remoteSyncClient.js"></script>
    <script src="options.js"></script>
  </body>
</html>
