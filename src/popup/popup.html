<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veracross Plus</title>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Veracross Plus</h1>
      </div>

      <div class="feature-card">
        <div class="feature-header">
          <div class="feature-title">
            Homework Checkboxes
          </div>
          <label class="switch">
            <input type="checkbox" id="enableChecklist" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="feature-description">
          Add interactive checkboxes to homework assignments for better task management and progress tracking.
        </div>
      </div>

      <div class="footer">
        Settings are saved automatically
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
