<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Veracross Plus Settings</title>
    <link rel="stylesheet" href="ui/tokens.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--vch-ground);
        color: var(--vch-text);
        font-family: var(--vch-font);
        font-size: 14px;
      }
      .card {
        max-width: 420px;
        padding: 20px 22px;
        background: var(--vch-surface);
        border: 1px solid var(--vch-border);
        border-radius: var(--vch-radius-card);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 500;
      }
      p {
        margin: 0;
        color: var(--vch-textMuted);
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Veracross Plus</h1>
      <p>Open the Veracross Plus toolbar icon to change settings.</p>
    </div>
  </body>
</html>
